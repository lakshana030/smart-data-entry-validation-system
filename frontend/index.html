<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Data Entry Validation System</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <!-- FORM CARD -->
    <div class="card">

        <h1>Smart Data Entry</h1>
        <p class="subtitle">Real-Time Validation Form</p>

        <form id="dataForm" autocomplete="on">

            <div id="loader">Loading...</div>
            <div id="successMessage" class="success-message" style="margin-bottom:15px; font-weight:bold;"></div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="example@email.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="10 digit number">
                <small class="error" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password">
                <small class="error" id="passwordError"></small>
            </div>

            <button type="submit" class="btn">Submit</button>

        </form>

    </div>


    <!-- USERS LIST -->
    <div class="card">

        <h2>Registered Users</h2>

        <!-- SEARCH BAR (VERY IMPORTANT) -->
        <input
            type="text"
            id="searchUser"
            autocomplete="new-password"
            placeholder="Search user by name or email"
            style="margin-bottom:10px;padding:10px;width:100%;border-radius:6px;border:1px solid #ccc;"
        >

        <div id="usersList"></div>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="js/validation.js"></script>

</body>
</html>
